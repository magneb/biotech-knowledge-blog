<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="100%" height="100%">
  <defs>
    <radialGradient id="cartoucheParchment" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="70%" stop-color="#f4ead5"/>
      <stop offset="100%" stop-color="#e8d9b8"/>
    </radialGradient>
  </defs>

  <g stroke="#110a04" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer Wing Flourishes Left & Right -->
    <path d="M 50 100 C 15 100 8 70 30 50 C 45 35 70 55 60 75" stroke="#8b6914" stroke-width="1.6"/>
    <circle cx="30" cy="50" r="3" fill="#8b6914"/>
    <path d="M 50 100 C 15 100 8 130 30 150 C 45 165 70 145 60 125" stroke="#8b6914" stroke-width="1.6"/>
    <circle cx="30" cy="150" r="3" fill="#8b6914"/>

    <path d="M 430 100 C 465 100 472 70 450 50 C 435 35 410 55 420 75" stroke="#8b6914" stroke-width="1.6"/>
    <circle cx="450" cy="50" r="3" fill="#8b6914"/>
    <path d="M 430 100 C 465 100 472 130 450 150 C 435 165 410 145 420 125" stroke="#8b6914" stroke-width="1.6"/>
    <circle cx="450" cy="150" r="3" fill="#8b6914"/>

    <!-- Master Oval Cartouche Rim -->
    <!-- Heavy Outer Oval -->
    <ellipse cx="240" cy="100" rx="180" ry="76" fill="url(#cartoucheParchment)" stroke-width="3" stroke="#110a04"/>
    <!-- Concentric Hairline Bevel Rings -->
    <ellipse cx="240" cy="100" rx="173" ry="69" stroke="#8b6914" stroke-width="1.2"/>
    <ellipse cx="240" cy="100" rx="170" ry="66" stroke="#352214" stroke-width="0.8" stroke-dasharray="4 2"/>
    <ellipse cx="240" cy="100" rx="164" ry="60" stroke="#8a7560" stroke-width="0.6"/>

    <!-- Top & Bottom Crown Flourishes -->
    <!-- Top Crown -->
    <path d="M 220 24 C 230 12 250 12 260 24" stroke="#8b6914" stroke-width="1.6"/>
    <polygon points="240,8 244,16 236,16" fill="#8b6914"/>
    <!-- Bottom Crown -->
    <path d="M 220 176 C 230 188 250 188 260 176" stroke="#8b6914" stroke-width="1.6"/>
    <polygon points="240,192 244,184 236,184" fill="#8b6914"/>

    <!-- Concentric Sunburst Engraving Rays (Top & Bottom Interior) -->
    <g stroke="#8a7560" stroke-width="0.7" opacity="0.65">
      <line x1="240" y1="24" x2="240" y2="40"/>
      <line x1="220" y1="27" x2="223" y2="42"/>
      <line x1="260" y1="27" x2="257" y2="42"/>
      <line x1="200" y1="33" x2="206" y2="46"/>
      <line x1="280" y1="33" x2="274" y2="46"/>
      <line x1="180" y1="42" x2="188" y2="52"/>
      <line x1="300" y1="42" x2="292" y2="52"/>

      <line x1="240" y1="176" x2="240" y2="160"/>
      <line x1="220" y1="173" x2="223" y2="158"/>
      <line x1="260" y1="173" x2="257" y2="158"/>
      <line x1="200" y1="167" x2="206" y2="154"/>
      <line x1="280" y1="167" x2="274" y2="154"/>
    </g>

    <!-- Typography Elements -->
    <!-- Top Arc Line: Oliver's Guide -->
    <text x="240" y="82" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" letter-spacing="0.04em" fill="#110a04" text-anchor="middle">Oliver&rsquo;s Guide</text>

    <!-- Centered Mini Oval for "to" -->
    <ellipse cx="240" cy="98" rx="16" ry="10" fill="#faf6ed" stroke="#8b6914" stroke-width="1.2"/>
    <text x="240" y="102" font-family="'Cormorant Garamond', Georgia, serif" font-size="13" font-style="italic" font-weight="600" fill="#6e3610" text-anchor="middle">to</text>

    <!-- Bottom Line: Everything -->
    <text x="240" y="136" font-family="'Cormorant Garamond', Georgia, serif" font-size="36" font-weight="700" letter-spacing="0.06em" fill="#110a04" text-anchor="middle">Everything</text>

    <!-- Flank Stars (✦) -->
    <g fill="#8b6914">
      <path d="M 125 100 Q 128 100 128 97 Q 128 100 131 100 Q 128 100 128 103 Q 128 100 125 100 Z"/>
      <path d="M 349 100 Q 352 100 352 97 Q 352 100 355 100 Q 352 100 352 103 Q 352 100 349 100 Z"/>
    </g>
  </g>
</svg>
