<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="pocketLensBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf6ed"/>
      <stop offset="70%" stop-color="#f4ead5"/>
      <stop offset="100%" stop-color="#e8d9b8"/>
    </radialGradient>
  </defs>

  <!-- Background Vignette -->
  <rect width="300" height="300" fill="url(#pocketLensBg)"/>
  <rect x="8" y="8" width="284" height="284" fill="none" stroke="#8a7560" stroke-width="1.2"/>
  <rect x="12" y="12" width="276" height="276" fill="none" stroke="#352214" stroke-width="0.6" stroke-dasharray="4 2"/>

  <!-- Victorian Handheld Pocket Specimen Loupe -->
  <g stroke="#110a04" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(150, 135)">
    <!-- Fluted Turned Ebony / Horn Handle -->
    <path d="M 38 65 L 75 125 C 80 132 72 138 65 132 L 28 72 Z" fill="#2c1e12" stroke-width="1.6"/>
    <line x1="33" y1="68" x2="70" y2="128" stroke="#f4ead5" stroke-width="0.9" opacity="0.4"/>
    <!-- Brass Ferrule Joining Handle to Ring -->
    <rect x="26" y="58" width="16" height="12" rx="2" transform="rotate(-35 34 64)" fill="#8b6914" stroke-width="1.4"/>

    <!-- Main Outer Brass Lens Bezel Ring -->
    <circle cx="-15" cy="-10" r="68" fill="#faf6ed" stroke-width="2.8"/>
    <circle cx="-15" cy="-10" r="62" fill="none" stroke="#8b6914" stroke-width="1.6"/>
    <circle cx="-15" cy="-10" r="58" fill="#ffffff" stroke="#352214" stroke-width="1"/>

    <!-- Concentric Glass Curvature & Glare Highlights -->
    <path d="M -55 -45 C -40 -60 5 -60 25 -40" stroke="#faf6ed" stroke-width="3" stroke-linecap="round"/>
    <path d="M -50 -40 C -38 -52 0 -52 18 -36" stroke="#c4a854" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- Magnified Specimen Inside Lens: Cellular Mitosis / Chromatin Split -->
    <g transform="translate(-15, -10)">
      <!-- Cell Membrane under tension -->
      <ellipse cx="0" cy="0" rx="38" ry="30" stroke="#8a7560" stroke-width="1.4" stroke-dasharray="3 2"/>
      <!-- Cytoplasmic Stippling -->
      <circle cx="-18" cy="-8" r="1" fill="#8a7560"/>
      <circle cx="-12" cy="14" r="1" fill="#8a7560"/>
      <circle cx="15" cy="-12" r="1" fill="#8a7560"/>
      <circle cx="20" cy="10" r="1" fill="#8a7560"/>
      <circle cx="0" cy="18" r="1" fill="#8a7560"/>
      <circle cx="0" cy="-18" r="1" fill="#8a7560"/>

      <!-- Mitotic Spindle Apparatus Fibres -->
      <path d="M -28 0 C -15 -18 15 -18 28 0" stroke="#8b6914" stroke-width="1"/>
      <path d="M -28 0 C -15 18 15 18 28 0" stroke="#8b6914" stroke-width="1"/>
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#6e3610" stroke-width="1.2"/>

      <!-- Centrosomes / Asters -->
      <circle cx="-28" cy="0" r="3" fill="#6e3610"/>
      <circle cx="28" cy="0" r="3" fill="#6e3610"/>

      <!-- Chromosome Chromatids Aligning at Metaphase Plate -->
      <path d="M -2 -14 C -6 -10 0 0 -4 14" stroke="#110a04" stroke-width="2.2"/>
      <path d="M 2 -14 C 6 -10 0 0 4 14" stroke="#110a04" stroke-width="2.2"/>
      <path d="M -6 -8 C -10 -4 -4 4 -8 8" stroke="#110a04" stroke-width="1.8"/>
      <path d="M 6 -8 C 10 -4 4 4 8 8" stroke="#110a04" stroke-width="1.8"/>
    </g>

    <!-- Decorative Engraved Cartouche Border along Outer Ring -->
    <path d="M -75 -40 C -82 -25 -82 5 -75 20" stroke="#8a7560" stroke-width="0.8"/>
    <path d="M 45 -40 C 52 -25 52 5 45 20" stroke="#8a7560" stroke-width="0.8"/>
  </g>

  <!-- Engraved Caption -->
  <text x="150" y="278" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" font-weight="600" font-style="italic" fill="#56402c" text-anchor="middle" letter-spacing="0.1em">Speculum Microscopium &bull; Brevitas</text>
</svg>
