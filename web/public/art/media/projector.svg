<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="vignetteParchment" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf6ed"/>
      <stop offset="70%" stop-color="#f4ead5"/>
      <stop offset="100%" stop-color="#e8d9b8"/>
    </radialGradient>
  </defs>

  <!-- Background Vignette -->
  <rect width="300" height="300" fill="url(#vignetteParchment)"/>
  <rect x="8" y="8" width="284" height="284" fill="none" stroke="#8a7560" stroke-width="1.2"/>
  <rect x="12" y="12" width="276" height="276" fill="none" stroke="#352214" stroke-width="0.6" stroke-dasharray="4 2"/>

  <!-- Antique Cinematograph / Projector -->
  <g stroke="#110a04" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(150, 140)">
    <!-- Wooden Tripod Legs -->
    <line x1="-10" y1="50" x2="-80" y2="135" stroke="#2c1e12" stroke-width="3.5"/>
    <line x1="0" y1="52" x2="0" y2="138" stroke="#1f1208" stroke-width="3"/>
    <line x1="10" y1="50" x2="80" y2="135" stroke="#2c1e12" stroke-width="3.5"/>
    <!-- Brass Leg Spreader Chains & Struts -->
    <line x1="-40" y1="95" x2="0" y2="98" stroke="#8b6914" stroke-width="1"/>
    <line x1="40" y1="95" x2="0" y2="98" stroke="#8b6914" stroke-width="1"/>
    <!-- Tripod Head Mount -->
    <polygon points="-16,50 16,50 12,38 -12,38" fill="#8b6914" stroke-width="1.4"/>
    <circle cx="0" cy="44" r="3" fill="#110a04"/>

    <!-- Main Camera / Projector Teak Body Box -->
    <rect x="-38" y="-35" width="60" height="72" rx="2" fill="#faf6ed" stroke-width="1.8"/>
    <rect x="-35" y="-32" width="54" height="66" fill="#e8d9b8" stroke-width="0.8" opacity="0.6"/>
    <!-- Woodgrain & Engraved Shading Lines -->
    <line x1="-30" y1="-28" x2="-30" y2="30" stroke="#8a7560" stroke-width="0.7"/>
    <line x1="-22" y1="-28" x2="-22" y2="30" stroke="#8a7560" stroke-width="0.7"/>
    <line x1="-14" y1="-28" x2="-14" y2="30" stroke="#8a7560" stroke-width="0.7"/>
    <line x1="12" y1="-28" x2="12" y2="30" stroke="#8a7560" stroke-width="0.7"/>

    <!-- Brass Film Spool Magazine Top (Twin Reels) -->
    <g transform="translate(-8, -48)">
      <!-- Left Reel -->
      <circle cx="-16" cy="0" r="18" fill="#f4ead5" stroke-width="1.5"/>
      <circle cx="-16" cy="0" r="7" fill="#8b6914" stroke-width="1"/>
      <line x1="-16" y1="-18" x2="-16" y2="18" stroke="#352214" stroke-width="0.7"/>
      <line x1="-34" y1="0" x2="2" y2="0" stroke="#352214" stroke-width="0.7"/>
      <!-- Right Reel -->
      <circle cx="16" cy="0" r="18" fill="#f4ead5" stroke-width="1.5"/>
      <circle cx="16" cy="0" r="7" fill="#8b6914" stroke-width="1"/>
      <line x1="16" y1="-18" x2="16" y2="18" stroke="#352214" stroke-width="0.7"/>
      <line x1="-2" y1="0" x2="34" y2="0" stroke="#352214" stroke-width="0.7"/>
      <!-- Film Strip passing between spools -->
      <path d="M -8 14 C -2 16 2 16 8 14" stroke="#110a04" stroke-width="1.8"/>
    </g>

    <!-- Brass Projection Lens Assembly (Facing Right) -->
    <g transform="translate(22, -2)">
      <rect x="0" y="-12" width="10" height="24" fill="#8b6914" stroke-width="1.4"/>
      <rect x="10" y="-16" width="18" height="32" fill="#faf6ed" stroke-width="1.6"/>
      <!-- Flared Objective Lens Hood -->
      <path d="M 28 -16 L 42 -22 L 42 22 L 28 16 Z" fill="#8b6914" stroke-width="1.6"/>
      <!-- Glass Lens Reflection -->
      <line x1="38" y1="-18" x2="38" y2="18" stroke="#faf6ed" stroke-width="1.5"/>
      <line x1="40" y1="-12" x2="40" y2="12" stroke="#ffffff" stroke-width="1"/>
      <!-- Projected Light Cone Hatching -->
      <path d="M 43 -12 L 65 -28 M 43 0 L 72 0 M 43 12 L 65 28" stroke="#c4a854" stroke-width="1" stroke-dasharray="3 3"/>
    </g>

    <!-- Hand-Crank Mechanism on Box Side -->
    <g transform="translate(-18, 12)">
      <circle cx="0" cy="0" r="6" fill="#8b6914" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-18" y2="-12" stroke="#110a04" stroke-width="2.2"/>
      <circle cx="-18" cy="-12" r="3.5" fill="#2c1e12" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Engraved Caption -->
  <text x="150" y="278" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" font-weight="600" font-style="italic" fill="#56402c" text-anchor="middle" letter-spacing="0.1em">Kinematograph &bull; Cin&eacute;ma Savant</text>
</svg>
