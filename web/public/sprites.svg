<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- ══════════════════════════════════════════════════════════════════════════
         STAR & FLOURISH VARIANTS (1 to 5)
         ══════════════════════════════════════════════════════════════════════════ -->

    <!-- Star Variant 1: Classic engraved concave 4-point star -->
    <symbol id="star-four-1" viewBox="0 0 24 24">
      <path
        d="M12 2 C12 7.5 16.5 12 22 12 C16.5 12 12 16.5 12 22 C12 16.5 7.5 12 2 12 C7.5 12 12 7.5 12 2 Z"
        fill="currentColor"
      />
    </symbol>
    <symbol id="star-four" viewBox="0 0 24 24">
      <use href="#star-four-1" />
    </symbol>

    <!-- Star Variant 2: Hand-inked organic star with slightly elongated vertical rays -->
    <symbol id="star-four-2" viewBox="0 0 24 24">
      <path
        d="M12 1 C12.3 7 16.2 11.6 22.5 12 C16.2 12.4 12.3 17 12 23 C11.7 17 7.8 12.4 1.5 12 C7.8 11.6 11.7 7 12 1 Z"
        fill="currentColor"
      />
      <circle cx="12" cy="12" r="1.2" fill="#f4ead5" />
    </symbol>

    <!-- Star Variant 3: 8-Point Compass Star with diagonal rays -->
    <symbol id="star-four-3" viewBox="0 0 24 24">
      <path
        d="M12 2 C12.2 6.8 16.8 11.8 22 12 C16.8 12.2 12.2 17.2 12 22 C11.8 17.2 7.2 12.2 2 12 C7.2 11.8 11.8 6.8 12 2 Z"
        fill="currentColor"
      />
      <path
        d="M6 6 L18 18 M18 6 L6 18"
        stroke="currentColor"
        stroke-width="1.2"
        stroke-linecap="round"
        opacity="0.75"
      />
    </symbol>
    <symbol id="star-flourish" viewBox="0 0 24 24">
      <use href="#star-four-3" />
    </symbol>

    <!-- Star Variant 4: Botanical Floral Star with rounded lobe tips -->
    <symbol id="star-four-4" viewBox="0 0 24 24">
      <path
        d="M12 2 C13 7 17 11 22 12 C17 13 13 17 12 22 C11 17 7 13 2 12 C7 11 11 7 12 2 Z"
        fill="currentColor"
      />
      <circle cx="12" cy="3" r="1" fill="currentColor" />
      <circle cx="21" cy="12" r="1" fill="currentColor" />
      <circle cx="12" cy="21" r="1" fill="currentColor" />
      <circle cx="3" cy="12" r="1" fill="currentColor" />
    </symbol>

    <!-- Star Variant 5: Medieval Diamond Star with diamond center -->
    <symbol id="star-four-5" viewBox="0 0 24 24">
      <polygon points="12,1 15,9 23,12 15,15 12,23 9,15 1,12 9,9" fill="currentColor" />
      <polygon points="12,7 14,12 12,17 10,12" fill="#f4ead5" opacity="0.6" />
    </symbol>


    <!-- ══════════════════════════════════════════════════════════════════════════
         HAND-DRAWN ARROW VARIANTS (1 to 5)
         Each has distinct organic line weight, fletching, and arrowhead
         ══════════════════════════════════════════════════════════════════════════ -->

    <!-- Arrow Variant 1: Slender Dip-Pen Arrow with Fletchings -->
    <symbol id="arrow-right-1" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2.5" y1="12" x2="19.5" y2="12" />
        <polyline points="13.5 6.5 20.5 12 13.5 17.5" />
        <!-- Feather fletchings -->
        <line x1="5.5" y1="9" x2="8" y2="12" stroke-width="1.2" />
        <line x1="5.5" y1="15" x2="8" y2="12" stroke-width="1.2" />
        <line x1="2.5" y1="9" x2="5" y2="12" stroke-width="1.2" />
        <line x1="2.5" y1="15" x2="5" y2="12" stroke-width="1.2" />
      </g>
    </symbol>
    <!-- Default alias -->
    <symbol id="arrow-right" viewBox="0 0 24 24">
      <use href="#arrow-right-1" />
    </symbol>

    <!-- Arrow Variant 2: Calligraphic Arched Dart with Solid Spearhead -->
    <symbol id="arrow-right-2" viewBox="0 0 24 24">
      <path
        d="M2.5 13 Q10.5 10.5 17 11.8"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
      />
      <!-- Sharp triangular solid spearhead -->
      <polygon points="14,6.5 21.5,12 14,17.5 16,12" fill="currentColor" />
      <!-- Tail notch flourish -->
      <circle cx="2.5" cy="13" r="1.3" fill="currentColor" />
    </symbol>

    <!-- Arrow Variant 3: Double-Feathered Surveyor's Antique Arrow -->
    <symbol id="arrow-right-3" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="12" x2="20" y2="12" stroke-width="1.75" />
        <!-- Open barbed arrowhead -->
        <path d="M13 6 L21 12 L13 18" stroke-width="1.75" />
        <!-- Double cross fletchings -->
        <line x1="4" y1="8" x2="7" y2="12" />
        <line x1="4" y1="16" x2="7" y2="12" />
        <line x1="7" y1="8" x2="10" y2="12" />
        <line x1="7" y1="16" x2="10" y2="12" />
      </g>
    </symbol>

    <!-- Arrow Variant 4: Delicate Hand-Wobbled Pen Flick with Asymmetric Barbs -->
    <symbol id="arrow-right-4" viewBox="0 0 24 24">
      <path
        d="M2.5 12.2 C6.5 11.6 11.5 12.6 19 11.8"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
      />
      <!-- Asymmetric hand-drawn barbs -->
      <path
        d="M13 6.8 C15.5 9 19.5 11.8 19.5 11.8 C16.5 13.8 13.5 17.8 13.5 17.8"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Quill ink deposit at start -->
      <path d="M2.5 12.2 Q4 10.5 4.5 12.2 Q4 13.8 2.5 12.2" fill="currentColor" />
    </symbol>

    <!-- Arrow Variant 5: Heavy Engraved Iron Harpoon Arrow with Notched Tail -->
    <symbol id="arrow-right-5" viewBox="0 0 24 24">
      <!-- Swallowtail notched tail -->
      <path
        d="M2 8.5 L5 12 L2 15.5 M4.5 12 L16 12"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Broad barbed broadhead -->
      <polygon points="13,5 21.5,12 13,19 15.5,12" fill="currentColor" />
    </symbol>


    <!-- ══════════════════════════════════════════════════════════════════════════
         DIAMONDS & CARTUCHES & FLOURISHES
         ══════════════════════════════════════════════════════════════════════════ -->

    <!-- Engraved Diamond ◆ with inner facet -->
    <symbol id="diamond" viewBox="0 0 24 24">
      <polygon points="12,2 22,12 12,22 2,12" fill="currentColor" />
      <polygon points="12,6 18,12 12,18 6,12" fill="#f4ead5" opacity="0.3" />
      <polygon points="12,8 16,12 12,16 8,12" fill="currentColor" />
    </symbol>

    <!-- Victorian Corner Filigree: Top-Left -->
    <symbol id="corner-flourish-tl" viewBox="0 0 40 40">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 36 V12 C4 7.58 7.58 4 12 4 H36" />
        <path d="M8 36 V16 C8 11.58 11.58 8 16 8 H36" stroke-width="0.75" opacity="0.6" />
        <path d="M12 4 C10 4 6 6 6 10 C6 13 9 14 11 13 C13 12 13 9 11 8 C9 7 6 9 6 12" />
        <path d="M4 12 C4 10 6 6 10 6 C13 6 14 9 13 11 C12 13 9 13 8 11 C7 9 9 6 12 6" />
        <circle cx="14" cy="14" r="1.5" fill="currentColor" />
      </g>
    </symbol>

    <!-- Victorian Corner Filigree: Top-Right -->
    <symbol id="corner-flourish-tr" viewBox="0 0 40 40">
      <use href="#corner-flourish-tl" transform="translate(40, 0) scale(-1, 1)" />
    </symbol>

    <!-- Victorian Corner Filigree: Bottom-Right -->
    <symbol id="corner-flourish-br" viewBox="0 0 40 40">
      <use href="#corner-flourish-tl" transform="translate(40, 40) scale(-1, -1)" />
    </symbol>

    <!-- Victorian Corner Filigree: Bottom-Left -->
    <symbol id="corner-flourish-bl" viewBox="0 0 40 40">
      <use href="#corner-flourish-tl" transform="translate(0, 40) scale(1, -1)" />
    </symbol>

    <!-- Generic Single Corner Flourish (24x24) -->
    <symbol id="corner-flourish" viewBox="0 0 24 24">
      <path
        d="M3 21 V9 C3 5.7 5.7 3 9 3 H21 M6 21 V12 C6 8.7 8.7 6 12 6 H21"
        fill="none"
        stroke="currentColor"
        stroke-width="1.25"
        stroke-linecap="round"
      />
      <circle cx="10" cy="10" r="1.2" fill="currentColor" />
    </symbol>

    <!-- Engraved Botanical Leaf / Acorn Endcap for Rules -->
    <symbol id="rule-leaf" viewBox="0 0 24 24">
      <path
        d="M2 12 C6 8 12 8 16 10 C18 6 21 4 22 4 C22 5 20 8 16 10 C18 14 18 18 14 22 C14 18 12 15 8 14 C5 14 3 13 2 12 Z"
        fill="currentColor"
        opacity="0.85"
      />
      <path d="M2 12 Q12 11 16 10" stroke="#f4ead5" stroke-width="0.75" fill="none" />
    </symbol>

    <!-- Cartouche Oval Frame Medallion -->
    <symbol id="cartouche-oval" viewBox="0 0 64 32">
      <ellipse
        cx="32"
        cy="16"
        rx="28"
        ry="13"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      />
      <ellipse
        cx="32"
        cy="16"
        rx="25"
        ry="10.5"
        fill="none"
        stroke="currentColor"
        stroke-width="0.75"
        stroke-dasharray="1 2"
      />
      <circle cx="3" cy="16" r="2" fill="currentColor" />
      <circle cx="61" cy="16" r="2" fill="currentColor" />
      <circle cx="32" cy="2" r="1.5" fill="currentColor" />
      <circle cx="32" cy="30" r="1.5" fill="currentColor" />
    </symbol>

    <!-- Eye of Inquiry / Arcane Insignia -->
    <symbol id="eye-insignia" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="16" y1="3" x2="16" y2="7" stroke-width="1" />
        <line x1="25" y1="7" x2="22" y2="10" stroke-width="1" />
        <line x1="7" y1="7" x2="10" y2="10" stroke-width="1" />
        <path d="M4 16 C8 10 24 10 28 16 C24 22 8 22 4 16 Z" />
        <circle cx="16" cy="16" r="4" fill="currentColor" />
        <circle cx="15" cy="15" r="1.2" fill="#f4ead5" />
      </g>
    </symbol>

    <!-- Bookmark Ribbon Indicator -->
    <symbol id="bookmark-ribbon" viewBox="0 0 24 24">
      <path
        d="M5 3 H19 V21 L12 17 L5 21 Z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linejoin="round"
      />
      <line x1="8" y1="6" x2="16" y2="6" stroke="currentColor" stroke-width="1" opacity="0.6" />
      <line x1="8" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="1" opacity="0.6" />
    </symbol>

    <!-- ══════════════════════════════════════════════════════════════════════════
         NAVIGATION & UTILITY ICONS (WP-6)
         ══════════════════════════════════════════════════════════════════════════ -->

    <!-- Search Loupe / Reading Glass -->
    <symbol id="search" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="6.5" stroke-width="1.6" />
        <line x1="14.8" y1="14.8" x2="21" y2="21" stroke-width="2.2" />
        <circle cx="10" cy="10" r="4.5" stroke-width="0.75" stroke-dasharray="1 1.5" opacity="0.6" />
        <circle cx="8" cy="8" r="0.8" fill="currentColor" />
      </g>
    </symbol>

    <!-- Antique Home / Folio Manor -->
    <symbol id="home" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12,2 21,9 19,9 19,21 5,21 5,9 3,9" stroke-width="1.6" />
        <rect x="9.5" y="13" width="5" height="8" stroke-width="1.4" />
        <circle cx="12" cy="6.5" r="1.2" fill="currentColor" />
      </g>
    </symbol>

    <!-- Brass Cogwheel / Settings Astrolabe -->
    <symbol id="gear" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" stroke-width="1.6" />
        <circle cx="12" cy="12" r="1.5" fill="currentColor" />
        <path d="M12 2 V4 M12 20 V22 M2 12 H4 M20 12 H22 M4.93 4.93 L6.34 6.34 M17.66 17.66 L19.07 19.07 M4.93 19.07 L6.34 17.66 M17.66 6.34 L19.07 4.93" stroke-width="2" />
      </g>
    </symbol>

    <!-- Victorian Ledger / Menu Drawer (3 engraved rules with diamond endpoints) -->
    <symbol id="menu" viewBox="0 0 24 24">
      <g stroke="currentColor" stroke-linecap="round">
        <line x1="4" y1="6" x2="20" y2="6" stroke-width="1.8" />
        <line x1="4" y1="12" x2="20" y2="12" stroke-width="1.8" />
        <line x1="4" y1="18" x2="20" y2="18" stroke-width="1.8" />
      </g>
      <polygon points="2,6 3,5 4,6 3,7" fill="currentColor" />
      <polygon points="20,6 21,5 22,6 21,7" fill="currentColor" />
      <polygon points="2,12 3,11 4,12 3,13" fill="currentColor" />
      <polygon points="20,12 21,11 22,12 21,13" fill="currentColor" />
      <polygon points="2,18 3,17 4,18 3,19" fill="currentColor" />
      <polygon points="20,18 21,17 22,18 21,19" fill="currentColor" />
    </symbol>

    <!-- Antique Cancel / Close (flourished X) -->
    <symbol id="close" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
        <line x1="5" y1="5" x2="19" y2="19" />
        <line x1="19" y1="5" x2="5" y2="19" />
      </g>
      <circle cx="5" cy="5" r="1.2" fill="currentColor" />
      <circle cx="19" cy="5" r="1.2" fill="currentColor" />
      <circle cx="5" cy="19" r="1.2" fill="currentColor" />
      <circle cx="19" cy="19" r="1.2" fill="currentColor" />
    </symbol>
  </defs>
</svg>
