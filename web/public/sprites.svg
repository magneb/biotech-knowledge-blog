<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- 4-point engraved star ✦ -->
    <symbol id="star-four" viewBox="0 0 24 24">
      <path
        d="M12 2 C12 7.5 16.5 12 22 12 C16.5 12 12 16.5 12 22 C12 16.5 7.5 12 2 12 C7.5 12 12 7.5 12 2 Z"
        fill="currentColor"
      />
    </symbol>

    <!-- Ornate Radiant Star / Compass Rose -->
    <symbol id="star-flourish" viewBox="0 0 24 24">
      <path
        d="M12 1 C12.2 6.5 17.5 11.8 23 12 C17.5 12.2 12.2 17.5 12 23 C11.8 17.5 6.5 12.2 1 12 C6.5 11.8 11.8 6.5 12 1 Z"
        fill="currentColor"
      />
      <circle cx="12" cy="12" r="1.5" fill="#f4ead5" />
      <path
        d="M6 6 L18 18 M18 6 L6 18"
        stroke="currentColor"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.6"
      />
    </symbol>

    <!-- Engraved Diamond ◆ with inner facet -->
    <symbol id="diamond" viewBox="0 0 24 24">
      <polygon points="12,2 22,12 12,22 2,12" fill="currentColor" />
      <polygon points="12,6 18,12 12,18 6,12" fill="#f4ead5" opacity="0.3" />
      <polygon points="12,8 16,12 12,16 8,12" fill="currentColor" />
    </symbol>

    <!-- Victorian Corner Filigree: Top-Left -->
    <symbol id="corner-flourish-tl" viewBox="0 0 40 40">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 36 V12 C4 7.58 7.58 4 12 4 H36" />
        <path d="M8 36 V16 C8 11.58 11.58 8 16 8 H36" stroke-width="0.75" opacity="0.6" />
        <!-- Scroll flourishes -->
        <path d="M12 4 C10 4 6 6 6 10 C6 13 9 14 11 13 C13 12 13 9 11 8 C9 7 6 9 6 12" />
        <path d="M4 12 C4 10 6 6 10 6 C13 6 14 9 13 11 C12 13 9 13 8 11 C7 9 9 6 12 6" />
        <circle cx="14" cy="14" r="1.5" fill="currentColor" />
      </g>
    </symbol>

    <!-- Victorian Corner Filigree: Top-Right -->
    <symbol id="corner-flourish-tr" viewBox="0 0 40 40">
      <use href="#corner-flourish-tl" transform="translate(40, 0) scale(-1, 1)" />
    </symbol>

    <!-- Victorian Corner Filigree: Bottom-Right -->
    <symbol id="corner-flourish-br" viewBox="0 0 40 40">
      <use href="#corner-flourish-tl" transform="translate(40, 40) scale(-1, -1)" />
    </symbol>

    <!-- Victorian Corner Filigree: Bottom-Left -->
    <symbol id="corner-flourish-bl" viewBox="0 0 40 40">
      <use href="#corner-flourish-tl" transform="translate(0, 40) scale(1, -1)" />
    </symbol>

    <!-- Generic Single Corner Flourish (default 24x24) -->
    <symbol id="corner-flourish" viewBox="0 0 24 24">
      <path
        d="M3 21 V9 C3 5.7 5.7 3 9 3 H21 M6 21 V12 C6 8.7 8.7 6 12 6 H21"
        fill="none"
        stroke="currentColor"
        stroke-width="1.25"
        stroke-linecap="round"
      />
      <circle cx="10" cy="10" r="1.2" fill="currentColor" />
    </symbol>

    <!-- Victorian Engraved Direction Arrow (Feathered / Antique) -->
    <symbol id="arrow-right" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="19" y2="12" />
        <polyline points="13 6 20 12 13 18" />
        <!-- Feather fletching accents -->
        <line x1="6" y1="9.5" x2="8" y2="12" stroke-width="1.2" />
        <line x1="6" y1="14.5" x2="8" y2="12" stroke-width="1.2" />
        <line x1="3" y1="9.5" x2="5" y2="12" stroke-width="1.2" />
        <line x1="3" y1="14.5" x2="5" y2="12" stroke-width="1.2" />
      </g>
    </symbol>

    <!-- Engraved Botanical Leaf / Acorn Endcap for Rules -->
    <symbol id="rule-leaf" viewBox="0 0 24 24">
      <path
        d="M2 12 C6 8 12 8 16 10 C18 6 21 4 22 4 C22 5 20 8 16 10 C18 14 18 18 14 22 C14 18 12 15 8 14 C5 14 3 13 2 12 Z"
        fill="currentColor"
        opacity="0.85"
      />
      <path d="M2 12 Q12 11 16 10" stroke="#f4ead5" stroke-width="0.75" fill="none" />
    </symbol>

    <!-- Cartouche Oval Frame Medallion -->
    <symbol id="cartouche-oval" viewBox="0 0 64 32">
      <ellipse
        cx="32"
        cy="16"
        rx="28"
        ry="13"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      />
      <ellipse
        cx="32"
        cy="16"
        rx="25"
        ry="10.5"
        fill="none"
        stroke="currentColor"
        stroke-width="0.75"
        stroke-dasharray="1 2"
      />
      <!-- Flourish nodes at left & right tips -->
      <circle cx="3" cy="16" r="2" fill="currentColor" />
      <circle cx="61" cy="16" r="2" fill="currentColor" />
      <circle cx="32" cy="2" r="1.5" fill="currentColor" />
      <circle cx="32" cy="30" r="1.5" fill="currentColor" />
    </symbol>

    <!-- Eye of Inquiry / Arcane Insignia -->
    <symbol id="eye-insignia" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <!-- Radiant rays -->
        <line x1="16" y1="3" x2="16" y2="7" stroke-width="1" />
        <line x1="25" y1="7" x2="22" y2="10" stroke-width="1" />
        <line x1="7" y1="7" x2="10" y2="10" stroke-width="1" />
        <!-- Eye shape -->
        <path d="M4 16 C8 10 24 10 28 16 C24 22 8 22 4 16 Z" />
        <circle cx="16" cy="16" r="4" fill="currentColor" />
        <circle cx="15" cy="15" r="1.2" fill="#f4ead5" />
      </g>
    </symbol>

    <!-- Bookmark Ribbon Indicator -->
    <symbol id="bookmark-ribbon" viewBox="0 0 24 24">
      <path
        d="M5 3 H19 V21 L12 17 L5 21 Z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linejoin="round"
      />
      <line x1="8" y1="6" x2="16" y2="6" stroke="currentColor" stroke-width="1" opacity="0.6" />
      <line x1="8" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="1" opacity="0.6" />
    </symbol>
  </defs>
</svg>
